# Hybrid Persian OCR — production stack
#   nginx (LB) -> N x api (FastAPI, stateless, async mode) -> redis -> worker(s) (Celery, own the models)
#   llama-server runs as its own GPU service; workers attach to it over HTTP.
#
# Scale the stateless tier freely (`--scale api=4`). Scale WORKERS to the number of
# GPU engine slots you can serve — that, not the API tier, is the throughput limit
# (one 7B Q4 model on one 12 GB GPU ≈ 1–2 concurrent images).
#
#   docker compose -f deploy/docker-compose.yml up --build --scale api=2 --scale worker=1

x-service-env: &service-env
  OCRS_BACKEND: llamacpp
  OCRS_ASYNC_MODE: "1"
  OCRS_REDIS_URL: redis://redis:6379/0
  OCRS_AUTOSTART_ENGINES: "0"                     # engines are separate services below
  OCRS_BACKEND_URL_PRIMARY: http://llama-primary:18236/v1
  OCRS_BACKEND_URL_SECONDARY: http://llama-secondary:18234/v1
  OCRS_ENABLE_SECONDARY_MODEL: "0"                # needs a second GPU (see README)
  OCRS_TESSERACT_LANGS: fas+eng
  OCRS_TESSERACT_REQUIRED: "1"
  OCRS_PREPROCESS_INCOMING: "1"
  OCRS_CACHE_PROMPT: "0"

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: uvicorn ocr_service.api:app --host 0.0.0.0 --port 8000 --workers 2
    environment: *service-env
    depends_on: [redis]
    deploy: { replicas: 2 }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: celery -A ocr_service.tasks worker -l info --concurrency=1 --prefetch-multiplier=1
    environment: *service-env
    depends_on: [redis, llama-primary]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  # GPU engine: official llama.cpp server image (CUDA). Mount the model directory
  # given in the brief. Assumption: same flags the dev engine uses (engine.py).
  llama-primary:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -m /models/lmstudio-community/Qwen2.5-VL-7B-Instruct-GGUF/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      --mmproj /models/lmstudio-community/Qwen2.5-VL-7B-Instruct-GGUF/mmproj-model-f16.gguf
      --host 0.0.0.0 --port 18236 -ngl 99 -c 16384 --image-min-tokens 1024 --image-max-tokens 16384
      --parallel 2
    volumes: ["D:/models/models:/models:ro"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  # Optional cross-check model. Start with `--profile secondary` on a host with a second GPU.
  llama-secondary:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [secondary]
    command: >
      -m /models/mradermacher/coreOCR-7B-050325-preview-GGUF/coreOCR-7B-050325-preview.Q4_K_S.gguf
      --mmproj /models/mradermacher/coreOCR-7B-050325-preview-GGUF/coreOCR-7B-050325-preview.mmproj-f16.gguf
      --host 0.0.0.0 --port 18234 -ngl 99 -c 16384 --image-min-tokens 1024 --image-max-tokens 16384
    volumes: ["D:/models/models:/models:ro"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
