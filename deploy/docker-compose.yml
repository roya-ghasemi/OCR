# Persian OCR — production stack (CPU only)
#   nginx -> api (FastAPI, enqueues) -> redis (queue + results) -> worker (Celery, reads pages)
#
# A page costs ~1-3 s of CPU spread over OCRS_WORKERS Tesseract processes. Size
# worker replicas x OCRS_WORKERS to the host's cores.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml up -d --scale worker=3

x-service-env: &service-env
  OCRS_ASYNC_MODE: "1"
  OCRS_REDIS_URL: redis://redis:6379/0
  OCRS_WORKERS: "4"

x-service: &service
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: ocr-service:latest
  environment: *service-env
  # Uploads are handed from api to worker through the spool volume, not through Redis.
  volumes: ["ocr-cache:/var/cache/ocr", "ocr-spool:/var/spool/ocr"]
  depends_on:
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *service
    command: uvicorn ocr_service.api:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers

  worker:
    <<: *service
    command: celery -A ocr_service.tasks worker -l info --concurrency=1 --prefetch-multiplier=1
    healthcheck:
      test: ["CMD-SHELL", "celery -A ocr_service.tasks inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3

  redis:
    image: redis:7-alpine
    # noeviction: Redis is the job queue. Under memory pressure it must refuse new jobs,
    # never silently drop queued ones. Results expire on their own (OCRS_JOB_TTL_S).
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  ocr-cache:
  ocr-spool:
