# Persian OCR — production stack (CPU only; no GPU, no model server)
#   nginx (LB) -> N x api (FastAPI, stateless, async mode) -> redis -> worker(s) (Celery)
#
# A page costs ~3 s of CPU across up to OCRS_WORKERS parallel Tesseract processes.
# Size workers x OCRS_WORKERS to the cores of the host.
#
#   docker compose -f deploy/docker-compose.yml up --build --scale api=2 --scale worker=2

x-service-env: &service-env
  OCRS_ASYNC_MODE: "1"
  OCRS_REDIS_URL: redis://redis:6379/0
  OCRS_WORKERS: "4"

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: uvicorn ocr_service.api:app --host 0.0.0.0 --port 8000 --workers 2
    environment: *service-env
    depends_on: [redis]
    deploy: { replicas: 2 }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: celery -A ocr_service.tasks worker -l info --concurrency=1 --prefetch-multiplier=1
    environment: *service-env
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
