worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS resolves the `api` service name to every replica.
    resolver 127.0.0.11 valid=10s;
    upstream ocr_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=15s;
    }

    # The service accepts uploads up to OCRS_MAX_UPLOAD_MB (25 MB); allow the multipart overhead.
    client_max_body_size 26m;
    # Async mode answers POST /ocr at once; the long timeout only matters for ?mode=sync.
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    # Per-client limit on uploads; polling and health checks are not limited.
    limit_req_zone $binary_remote_addr zone=ocr_upload:10m rate=2r/s;

    server {
        listen 80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /healthz { proxy_pass http://ocr_api/healthz; access_log off; }
        location = /health  { proxy_pass http://ocr_api/health; }
        location /jobs/     { proxy_pass http://ocr_api; }
        location = /ocr {
            limit_req zone=ocr_upload burst=10 nodelay;
            proxy_request_buffering off;
            proxy_pass http://ocr_api;
        }
        # The upload page and its assets.
        location = /        { proxy_pass http://ocr_api; }
        location /static/   { proxy_pass http://ocr_api; }
        location / { return 404; }
    }
}
