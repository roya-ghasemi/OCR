worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS resolves the `api` service name to every replica.
    resolver 127.0.0.11 valid=10s;
    upstream ocr_api {
        least_conn;                 # inference requests are long; least-connections beats round-robin
        server api:8000 max_fails=3 fail_timeout=15s;
    }

    client_max_body_size 20m;       # raw phone photos; the service compresses to <300 KB itself
    proxy_read_timeout 620s;        # a synchronous /ocr can take minutes on a loaded GPU
    proxy_send_timeout 60s;

    server {
        listen 80;
        location /health { proxy_pass http://ocr_api/health; }
        location /jobs/  { proxy_pass http://ocr_api; }
        location /ocr    { proxy_pass http://ocr_api; proxy_request_buffering off; }
        location / { return 404; }
    }
}
