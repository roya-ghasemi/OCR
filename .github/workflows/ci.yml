name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Tesseract and the pinned models
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-noto-core
          curl -fsSL -o models/tesseract/fas.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec/fas.traineddata
          curl -fsSL -o models/tesseract/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -f deploy/Dockerfile -t ocr-service:ci .
      - name: Image size
        run: docker image ls ocr-service:ci
